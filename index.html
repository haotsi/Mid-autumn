<body><main><div id="scene" aria-label="可旋转的北大楼中秋三维场景"></div><div class="vignette"></div><header><a class="brand" href="#" aria-label="回到初始视角"><span class="seal">金陵</span><span>北大楼 · 中秋夜<br><small>A MOONLIT CAMPUS</small></span></a><span class="edition">丙午年 · 八月十五</span></header><section class="intro"><div class="eyebrow">MID-AUTUMN &nbsp; / &nbsp; 2026</div><h1>月满金陵<span>此刻，共团圆。</span></h1><p>一轮月，一盏灯，一院桂花香。<br>在北大楼下，把思念交给月光。</p><div class="hairline"></div><span class="poem">海上生明月 · 天涯共此时</span></section><div id="status" role="status">正在点亮北大楼…</div><div id="blessing" role="status"></div><section id="wish-panel" class="wish-panel" hidden aria-labelledby="wish-title"><div class="wish-card"><button id="wish-close" class="wish-close" type="button" aria-label="关闭祈愿灯面板">×</button><div class="eyebrow">A WISH UNDER THE MOON</div><h2 id="wish-title">把心愿交给月光</h2><p>写下一句话，让它化作一盏灯，慢慢升到月亮身边。</p><form id="wish-form"><label for="wish-input">你的心愿</label><textarea id="wish-input" maxlength="42" rows="3" placeholder="愿家人平安，愿所行皆有光……" required></textarea><div class="wish-form-footer"><span id="wish-count">0 / 42</span><button type="submit">点亮祈愿灯 ↗</button></div></form><div id="wish-log" class="wish-log" aria-live="polite"></div></div></section><footer><div class="caption"><span class="dot"></span> 南京大学 · 北大楼 <small>拖动环绕 / 滚轮缩放 / 轻点灯笼与月亮</small></div><div class="controls"><button id="mood" aria-pressed="true">◉ 灯火夜景</button><button id="reset">↺ 归位</button><button id="wish">写下心愿 ↗</button></div></footer></main><script type="module" src="app.js"></script></body></html>
